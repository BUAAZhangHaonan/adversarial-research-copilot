chat_mode:
  # At least this many rounds must be completed before judge can stop.
  min_rounds_before_stop: 2
  # HARD cap on total debate rounds across all review cycles (0 = unlimited).
  max_rounds: 60
  # At least 20 references are required for each chat-mode run.
  min_references: 20
  # Suggested response length hint only (no hard truncation).
  max_response_chars: 4000
  # Suggested paragraph count hint only (no hard truncation).
  max_paragraphs: 3
  # One-click concise consensus export.
  export_best_consensus: true
  persist_state: true
  # Prompt language for iterative chat mode: en|zh.
  prompt_language: en
  # Drift monitor fires every N inner debate rounds.
  drift_check_interval: 5
  # Maximum review cycles (outer loop). 0 = unlimited.
  max_review_cycles: 10
  # Maximum inner debate rounds per review cycle. 0 = unlimited.
  max_inner_debate_rounds: 20
  # How many past review cycles to keep in LLM context (sliding window).
  context_window_cycles: 3
