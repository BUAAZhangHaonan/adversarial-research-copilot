draws: 5
max_rounds: 6
budget_cny: '20'
reasoning_effort: max
archive_window: 8
allow_stage_transition: false

# Aliases resolve in the adapter. All discover responsibilities share this alias
# unless the user explicitly overrides scout, ideator or editor in roles.
research_model: deepseek-flash
models:
  deepseek-flash:
    provider: deepseek
    model: deepseek-flash
    reasoning_effort: max
    thinking: enabled
    capabilities:
      json_output: true
      tools: true
      streaming_usage: true
      max_output_tokens: 384000
# Additional compatible aliases may specify provider: openai_compatible,
# base_url, base_url_env: null, api_key_env and their actual capabilities.
# Supply pricing_path with that model's reviewed CNY usage rates and limits.
# Provider-specific protocols or billing schemes require a separate adapter.
