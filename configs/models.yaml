generation_defaults:
  temperature: 0.3
  # Default to larger context outputs for long-form research artifacts.
  max_output_tokens: 16384
  # Used when transient gateway errors require a lighter retry payload.
  fallback_max_output_tokens: 4096

models:
  deepseek-v4-flash:
    provider: deepseek
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    endpoint: chat_completions
    max_tokens: 16384
    temperature: 0.3
  deepseek-v4-pro:
    provider: deepseek
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    endpoint: chat_completions
    max_tokens: 16384
    temperature: 0.3
  gpt-5.4:
    provider: gpt
    base_url_env: GPT_BASE_URL
    api_key_env: GPT_API_KEY
    endpoint: chat_completions
    max_output_tokens: 16384
    temperature: 0.3
  glm-5.1:
    provider: glm
    base_url_env: GLM_BASE_URL
    api_key_env: GLM_API_KEY
    endpoint: chat_completions
    max_tokens: 16384
    temperature: 0.3

aliases:
  proposer_default: deepseek-v4-flash
  skeptic_default: deepseek-v4-flash
  moderator_default: deepseek-v4-pro
