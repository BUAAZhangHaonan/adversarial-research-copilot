[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-research-copilot"
version = "0.2.0"
description = "Evidence-grounded research cards, feasibility development and adversarial review."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "BUAAZhangHaonan" }
]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "openai>=2,<3",
  "mcp>=2,<3",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
  "tzdata>=2026.1",
  "rich>=13.7.1",
  "Jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=1,<2",
  "build>=1,<2"
]

[project.scripts]
arc = "arc.cli:app"

[tool.setuptools]
package-dir = {"" = "src", "arc_prompt_assets" = "prompts", "arc_config_assets" = "configs"}
packages = ["arc", "arc_prompt_assets", "arc_config_assets"]

[tool.setuptools.package-data]
arc_prompt_assets = ["manifest.json", "common/*.md", "roles/*.md", "tasks/*.md", "tools/*.md", "reports/*.md"]
arc_config_assets = ["pricing.json", "runtime.yaml", "mcp.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["references", ".venv", "dist", "build"]
