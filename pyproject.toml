[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-research-copilot"
version = "0.1.0"
description = "An adversarial multi-agent framework for iterative research idea critique, refinement, and convergence."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "BUAAZhangHaonan" }
]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "requests>=2.32.3",
  "rich>=13.7.1",
  "Jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[project.scripts]
arc = "arc.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
